name: Android Build

on:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK parts
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-$HOME/android-sdk}"
          mkdir -p "$ANDROID_HOME"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then
            echo "Downloading Android command-line tools..."
            wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdtools.zip
            unzip -q cmdtools.zip -d cmdtmp
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            mv cmdtmp/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          fi
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platform-tools" "build-tools;34.0.0" "platforms;android-34" "cmdline-tools;latest"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Install Godot + export templates
        run: |
          BASE=https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable
          wget -q $BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          wget -q $BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          sudo mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          mkdir -p ~/.local/share/godot/export_templates
          unzip -q Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          mv templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          godot --version

      - name: Debug keystore + editor settings
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android \
            -keystore $HOME/debug.keystore -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          mkdir -p ~/.config/godot
          {
            echo '[gd_resource type="EditorSettings" format=3]'
            echo '[resource]'
            echo "export/android/android_sdk_path = \"$ANDROID_HOME\""
            echo "export/android/java_sdk_path = \"$JAVA_HOME\""
            echo "export/android/debug_keystore = \"$HOME/debug.keystore\""
            echo 'export/android/debug_keystore_user = "androiddebugkey"'
            echo 'export/android/debug_keystore_pass = "android"'
          } > ~/.config/godot/editor_settings-4.3.tres

      - name: Import project
        run: godot --headless --import || true

      - name: Export APK
        run: |
          mkdir -p build
          godot --headless --export-debug "Android" build/eduverse3d.apk 2>&1 | tee export.log
          test -f build/eduverse3d.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eduverse3d-apk
          path: |
            build/eduverse3d.apk
            export.log
          if-no-files-found: warn
